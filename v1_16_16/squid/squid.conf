# =============================================================================
# Squid Configuration — AI Secure Sandbox (Hardened)
#
# Egress controls:
#   [1] Default-deny: only whitelist.txt domains allowed
#   [2] IP direct access blocked
#   [3] DoH blocked
#   [4] CONNECT port 443 only
#   [5] Privacy headers stripped
#   [6] cache deny all (no disk caching)
#   [7] cache_mem 64MB explicit
#       IMPORTANT: Squid default cache_mem = 256MB.
#       With mem_limit: 512m on the container, leaving this at default
#       causes OOM. Set to 64MB — sufficient when cache deny all is active.
# =============================================================================

http_port 3128

# ── [1] Whitelist ─────────────────────────────────────────────────────────────
acl whitelist dstdomain "/etc/squid/whitelist.txt"

# ── [1b] Cache manager — localhost only ───────────────────────────────────────
# The container healthcheck runs `squidclient -h 127.0.0.1 -p 3128 mgr:info`
# from inside this container, so localhost must be allowed. Any other
# client on the internal network is denied — otherwise the devcontainer
# could read proxy configuration and full traffic statistics.
acl manager_urlpath urlpath_regex ^/squid-internal-mgr/
acl localhost_src src 127.0.0.1/32 ::1
http_access allow manager_urlpath localhost_src
http_access deny manager_urlpath

# ── [2] IP direct access block ────────────────────────────────────────────────
acl private_ip dst 10.0.0.0/8
acl private_ip dst 172.16.0.0/12
acl private_ip dst 192.168.0.0/16
acl private_ip dst 127.0.0.0/8
acl private_ip dst fc00::/7
acl private_ip dst ::1

acl dst_is_ip dstdom_regex ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$
http_access deny dst_is_ip !private_ip

# ── [3] DoH block ─────────────────────────────────────────────────────────────
acl doh_providers dstdomain \
    dns.google                    \
    dns64.dns.google              \
    cloudflare-dns.com            \
    security.cloudflare-dns.com   \
    family.cloudflare-dns.com     \
    dns.quad9.net                 \
    doh.opendns.com               \
    doh.familyshield.opendns.com  \
    dns.adguard.com               \
    dns-unfiltered.adguard.com    \
    doh.cleanbrowsing.org         \
    doh.dnssb.net                 \
    dns.nextdns.io                \
    dns.controld.com

http_access deny doh_providers

# ── [4] CONNECT port 443 only ─────────────────────────────────────────────────
acl CONNECT method CONNECT
acl safe_ssl_port port 443
http_access deny CONNECT !safe_ssl_port

# ── [5] Whitelist allow / deny all ────────────────────────────────────────────
http_access allow whitelist
http_access deny all

# ── Logging ───────────────────────────────────────────────────────────────────
access_log /var/log/squid/access.log squid
cache_log  /var/log/squid/cache.log

# ── Cache ─────────────────────────────────────────────────────────────────────
# [FIX] cache_dir null /tmp removed — redundant once "cache deny all" and
# maximum_object_size 0 KB are set; it only added log noise ("Ignoring").
cache deny all
maximum_object_size 0 KB
cache_mem 64 MB

# ── Runtime ────────────────────────────────────────────────────────────────────
# [FIX] pid_filename none — /run is overlaid by tmpfs at container runtime,
# so the pid directory baked into the image is not visible then. Squid runs
# via -N (no daemon/pid file needed here) so disable it explicitly rather
# than relying on a path that may not exist at runtime.
pid_filename none

# ── Privacy headers ───────────────────────────────────────────────────────────
forwarded_for off
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Cache-Control deny all

# ── DNS ───────────────────────────────────────────────────────────────────────
dns_nameservers 127.0.0.11
# [FIX] dns_ttl_max/dns_ttl_min are NOT real Squid directives — Squid treats
# an unrecognized directive as a FATAL parse error (exit code 1), not a
# warning. This silently killed the container on every start (Docker saw
# it as a crash loop). The real directives are positive_dns_ttl and
# negative_dns_ttl.
positive_dns_ttl 5 minutes
negative_dns_ttl 1 minute
